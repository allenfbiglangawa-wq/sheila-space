<meta name="theme-color" content="#1c1713" media="(prefers-color-scheme: dark)">

<style>
/* VOICE everyday and tender: a private notebook, calm and warm
   IDEA a linen-bound planner with tabbed sections and tucked-in cards
   PICTURE home: this week's grid of filled days (lakad, pasasalamat, check-in) beside today's verse
   COLOUR beige linen ground, oat paper cards, espresso ink, dusty rose accent, sage for growth
   TYPE Instrument Serif titles + DM Sans text
   LAYOUT tab row on top; laptop: two-column cards; phone: one column, tabs scroll sideways */
:root{color-scheme:light dark;
--bg:light-dark(#ebe1d3,#1c1713);
--paper:light-dark(#f8f3ec,#27201b);
--paper2:light-dark(#f1e9de,#2f2721);
--ink:light-dark(#2a211b,#f0e7dc);
--soft:light-dark(#6f6155,#b9aa9a);
--line:light-dark(#d9ccbb,#43382f);
--rose:light-dark(#b0695e,#e0a196);
--roseBg:light-dark(#efd9d2,#4a2e29);
--sage:light-dark(#6f7d5c,#a9b98f);
--sageBg:light-dark(#dfe3d2,#323a28);
--taupe:light-dark(#a38c76,#8c7764)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "DM Sans",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Instrument Serif",Georgia,serif;font-weight:400;line-height:1.05;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:clamp(36px,6vw,52px)}
h2{font-size:clamp(30px,4.5vw,40px)}
h3{font-size:24px}
p{margin:0}
a{color:var(--rose)}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) max(5vw,16px) 4px}
.brand b{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:26px}
.brand span{color:var(--soft);font-size:14px;white-space:nowrap}
nav{display:flex;gap:6px;overflow-x:auto;padding:6px max(5vw,16px) 10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;text-decoration:none;color:var(--ink);font-size:14px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper);min-height:38px;display:flex;align-items:center}
nav a.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{max-width:1180px;margin:0 auto;padding:clamp(20px,3vw,40px) max(5vw,16px) 80px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px;margin-bottom:20px}
.head p{color:var(--soft);max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px;align-items:start}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px}
.card.tint{background:var(--paper2)}
.card h3{margin-bottom:12px}
.stack>*+*{margin-top:12px}
label{display:block;font-size:14px;color:var(--soft);margin-bottom:4px}
input,select,textarea{width:100%;font:16px/1.4 "DM Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:44px}
textarea{min-height:110px;resize:vertical}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--rose);min-height:32px}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--sage);margin:0;flex:none}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,nav a:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:10px}
button{font:500 15px "DM Sans",system-ui,sans-serif;min-height:44px;padding:10px 18px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button.sm{min-height:36px;padding:6px 12px;font-size:14px}
button.del{background:transparent;color:var(--rose);border-color:transparent;padding-inline:8px}
button:active{transform:translateY(1px)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.muted{color:var(--soft);font-size:14px}
.empty{color:var(--soft);text-align:center;padding:28px 12px;border:1px dashed var(--line);border-radius:14px}
.chip{display:inline-block;font-size:13px;padding:3px 10px;border-radius:999px;background:var(--roseBg);color:var(--ink);white-space:nowrap}
.chip.g{background:var(--sageBg)}
.chip.n{background:var(--paper2);border:1px solid var(--line)}
.bar{height:10px;border-radius:99px;background:var(--paper2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--rose);border-radius:99px}
.bar.g i{background:var(--sage)}
.big{font-family:"Instrument Serif",Georgia,serif;font-size:clamp(34px,6vw,46px);line-height:1;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.stat small{display:block;color:var(--soft);font-size:13px}
.stat b{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:30px;white-space:nowrap}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.num{white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.pos{color:var(--sage)}.neg{color:var(--rose)}
/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.verse{background:var(--ink);color:var(--bg);border-radius:22px;padding:clamp(22px,3vw,36px);display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-height:300px}
.verse q{font-family:"Instrument Serif",Georgia,serif;font-size:clamp(24px,3.2vw,32px);line-height:1.2;quotes:none}
.verse .ref{font-size:14px;opacity:.8}
.week{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:clamp(18px,2.5vw,28px)}
.wk{display:grid;grid-template-columns:7.5em repeat(7,minmax(0,1fr));gap:6px;align-items:center;margin-top:14px}
.wk .d{text-align:center;font-size:13px;color:var(--soft)}
.wk .d.t{color:var(--ink);font-weight:700}
.wk .l{font-size:14px}
.cell{aspect-ratio:1;border-radius:10px;background:var(--paper2);border:1px solid var(--line)}
.cell.f1{background:var(--sage);border-color:var(--sage)}
.cell.f2{background:var(--rose);border-color:var(--rose)}
.cell.f3{background:var(--taupe);border-color:var(--taupe)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:10px;margin-top:16px}
.tile{display:block;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;min-height:96px}
.tile b{display:block;font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:22px;line-height:1.1}
.tile span{font-size:13px;color:var(--soft)}
/* vision */
.board{columns:3 260px;column-gap:14px}
.vc{break-inside:avoid;margin-bottom:14px;background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.vc img{display:block;width:100%;height:auto}
.vc .ph{aspect-ratio:4/3;display:grid;place-items:center;padding:20px;text-align:center;font-family:"Instrument Serif",Georgia,serif;font-size:28px;line-height:1.1}
.vc .in{padding:14px 16px}
.vc.done{opacity:.75}
/* chart */
.fig{position:relative;min-height:220px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
svg text{font:13px "DM Sans",sans-serif;fill:var(--soft);paint-order:stroke;stroke:var(--paper);stroke-width:4px}
/* breathing */
.breath{display:grid;place-items:center;height:190px}
.circ{width:80px;height:80px;border-radius:50%;background:var(--sageBg);border:2px solid var(--sage);display:grid;place-items:center;font-size:14px}
.circ.go{animation:br 16s ease-in-out infinite}
@keyframes br{0%{transform:scale(1)}25%{transform:scale(2)}50%{transform:scale(2)}75%{transform:scale(1)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.circ.go{animation:none}}
.help{background:var(--roseBg);border-radius:16px;padding:16px 18px}
.checks label{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:15px;margin:0;padding:6px 0;min-height:40px}
.sealed{background:var(--paper2);border:1px dashed var(--taupe)}
details summary{cursor:pointer;min-height:40px;display:flex;align-items:center}
.modal{position:fixed;inset:0;background:rgb(0 0 0/.4);display:grid;place-items:center;padding:16px;z-index:20}
.modal .card{max-width:420px;width:100%}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:30;max-width:90vw}
.warn{background:var(--roseBg);padding:12px 16px;border-radius:12px;margin-bottom:16px;font-size:14px}
@media(max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}.verse{min-height:0}}
@media(max-width:420px){.wk{grid-template-columns:6.2em repeat(7,minmax(0,1fr));gap:4px}.wk .l{font-size:13px}}
.brand .tg{min-height:34px;padding:4px 12px;font-size:13px;background:transparent;color:var(--ink);border-color:var(--line)}
nav.sub{padding-top:0}
nav.sub a{font-size:13px;min-height:34px;padding:6px 12px;background:transparent}
nav.sub a.on{background:var(--roseBg);color:var(--ink);border-color:var(--rose)}
.hgrid{display:grid;grid-template-columns:minmax(7em,1.6fr) repeat(7,minmax(0,1fr)) 3.2em;gap:6px;align-items:center}
.hgrid .d{text-align:center;font-size:13px;color:var(--soft)}
.hc{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--paper2);padding:0;min-height:0;width:100%;cursor:pointer}
.hc.on{background:var(--sage);border-color:var(--sage)}
.chap{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:8px}
.chap button{min-height:40px;padding:0;border-radius:10px;background:var(--paper2);color:var(--ink);border-color:var(--line);font-size:13px}
.chap button.on{background:var(--sage);border-color:var(--sage);color:#fff}
.jar{background:var(--ink);color:var(--bg);border-radius:22px;padding:clamp(22px,3vw,34px);min-height:200px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.jar p.big2{font-family:"Instrument Serif",Georgia,serif;font-size:clamp(26px,4vw,36px);line-height:1.15}
.tl{position:relative;padding-left:26px;list-style:none;margin:0}
.tl:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl>li{position:relative;margin-bottom:18px}
.tl>li:before{content:"";position:absolute;left:-23px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--rose);border:2px solid var(--bg)}
.tl img{display:block;max-width:100%;border-radius:14px;margin-top:8px}
.cd{display:flex;align-items:center;gap:14px}
.cd .big{min-width:2.2em;text-align:center}
.task{display:flex;align-items:center;gap:10px}
.task.done span{text-decoration:line-through;color:var(--soft)}
.hn0{}
@media(max-width:520px){.hgrid{grid-template-columns:repeat(7,minmax(0,1fr)) 2.6em;gap:5px}.hgrid .hn{grid-column:1/-1;margin-top:6px}.hgrid .hn0{display:none}}
.ring{display:grid;place-items:center;width:150px;height:150px;border-radius:50%;margin:0 auto}
.ring div{width:118px;height:118px;border-radius:50%;background:var(--paper);display:grid;place-items:center;text-align:center;line-height:1.1}
#auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.authbox{width:100%;max-width:420px;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:clamp(22px,5vw,34px);display:flex;flex-direction:column;gap:14px}
.authbox .logo{width:54px;height:54px;border-radius:50%;background:var(--ink);color:var(--roseBg);display:grid;place-items:center;font-family:"Instrument Serif",Georgia,serif;font-size:32px}
.authbox h1{font-size:36px}
.chk{display:flex!important;align-items:center;gap:10px;color:var(--ink)!important;font-size:15px!important}
.chk input{width:20px;height:20px;min-height:0;flex:none;margin:0;accent-color:var(--rose)}
.alinks{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:15px}
.aerr{color:var(--rose);min-height:1.2em;margin:0;font-size:14px}
.reckey{font:600 18px/1.5 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em;background:var(--paper2);border:1px dashed var(--taupe);border-radius:12px;padding:14px;text-align:center;overflow-wrap:anywhere;user-select:all}
button:disabled{opacity:.5;cursor:not-allowed}
</style>
</head>

{

const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const TODAY=()=>ymd(new Date());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const nice=s=>parse(s).toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};

const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};

function ask(msg,yes){const L=$('#layer');L.innerHTML=`<div class="modal"><div class="card stack"><p></p><div class="btns"><button id="mYes">Yes, delete</button><button class="ghost" id="mNo">Cancel</button></div></div></div>`;L.querySelector('p').textContent=msg;$('#mNo').onclick=()=>L.innerHTML='';$('#mYes').onclick=()=>{L.innerHTML='';yes()}}
function streak(has){let n=0,d=TODAY();if(!has(d))d=addDays(d,-1);while(has(d)){n++;d=addDays(d,-1)}return n}
let vOff=0,ro=null,bMonth=TODAY().slice(0,7),jq='',openJ=null,cPick=null,dPick=null,pDate=TODAY();
const daysTo=s=>Math.round((parse(s)-parse(TODAY()))/864e5);
const nextOcc=(s,yearly)=>{if(!yearly)return s;const t=TODAY(),y=+t.slice(0,4);let n=y+s.slice(4);if(n<t)n=(y+1)+s.slice(4);return n};
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
const hrs=(b,w)=>{if(!b||!w)return 0;const m=x=>{const[h,mm]=x.split(':').map(Number);return h*60+mm};return ((m(w)-m(b)+1440)%1440)/60};
const dim=m=>new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();
const billDate=(b,m)=>m+'-'+pad(Math.min(b.due,dim(m)));
function cycleInfo(){const p=[...S.periods].sort((a,b)=>a.start.localeCompare(b.start));if(!p.length)return null;const gaps=p.slice(1).map((x,i)=>daysTo(x.start)-daysTo(p[i].start)).filter(g=>g>=15&&g<=60).slice(-6);const avg=gaps.length?Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length):28;const lens=p.filter(x=>x.end).map(x=>daysTo(x.end)-daysTo(x.start)+1).slice(-6);const plen=lens.length?Math.round(lens.reduce((a,b)=>a+b,0)/lens.length):5;const last=p[p.length-1];return{avg,plen,last,day:-daysTo(last.start)+1,next:addDays(last.start,avg)}}

V.walk=()=>{
 const t=TODAY(),w=S.walks[t]||{steps:'',mins:'',km:''},days=[...Array(7)].map((_,i)=>addDays(t,i-6));
 const mx=Math.max(S.walkGoal,...days.map(d=>(S.walks[d]||{}).steps||0));
 const st=streak(d=>S.walks[d]&&S.walks[d].steps>=S.walkGoal),m=t.slice(0,7);
 const mon=Object.entries(S.walks).filter(([d])=>d.startsWith(m)),tot=mon.reduce((a,[,x])=>a+(x.steps||0),0),km=mon.reduce((a,[,x])=>a+(Number(x.km)||0),0);
 const tp=Math.min(100,((w.steps||0)/S.walkGoal)*100);
 return `<div class="head"><div><h1>Walking Tracker</h1><p>One step at a time. Daily goal: ${S.walkGoal.toLocaleString()} steps.</p></div></div>
 <div class="stats" style="margin-bottom:16px"><div class="stat"><small>Today</small><b>${(w.steps||0).toLocaleString()}</b><div class="bar g" style="margin-top:6px"><i style="width:${tp}%"></i></div></div><div class="stat"><small>Goal streak</small><b>${st} ${st===1?'day':'days'}</b></div><div class="stat"><small>This month</small><b>${tot.toLocaleString()}</b><small>steps</small></div><div class="stat"><small>Distance this month</small><b>${km.toFixed(1)} km</b></div></div>
 <div class="grid"><form id="fW" class="card stack"><h3>Log a walk</h3><div><label for="wD">Date</label><input id="wD" type="date" value="${t}"></div><div class="row"><div><label for="wS">Steps</label><input id="wS" type="number" min="0" inputmode="numeric" value="${w.steps}"></div><div><label for="wM">Minutes</label><input id="wM" type="number" min="0" inputmode="numeric" value="${w.mins}"></div><div><label for="wK">Km</label><input id="wK" type="number" min="0" step="0.1" inputmode="decimal" value="${w.km}"></div></div><button>Save</button>
 <div class="row" style="align-items:end;border-top:1px solid var(--line);padding-top:12px"><div><label for="wG">Daily goal (steps)</label><input id="wG" type="number" min="500" step="500" value="${S.walkGoal}"></div><button type="button" class="ghost" data-a="wgoal">Update</button></div></form>
 <div class="card"><h3>Last 7 days</h3>${days.map(d=>{const s=(S.walks[d]||{}).steps||0;return `<div style="display:grid;grid-template-columns:3.2em minmax(0,1fr) 5.5em;gap:10px;align-items:center;margin:10px 0"><span class="muted">${parse(d).toLocaleDateString('en-PH',{weekday:'short'})}</span><div class="bar${s>=S.walkGoal?' g':''}" style="height:16px"><i style="width:${s/mx*100}%"></i></div><span class="num">${s.toLocaleString()}</span></div>`}).join('')}<p class="muted">Green means you hit your goal.</p></div></div>`};

const QUAL=['Restless','Light','Okay','Good','Great'];
V.sleep=()=>{

 const avg=logged.length?logged.reduce((a,d)=>a+hrs(S.sleep[d].bed,S.sleep[d].wake),0)/logged.length:0;

 const list=Object.keys(S.sleep).sort().reverse().slice(0,14);
 return `<div class="head"><div><h1>Sleep Log</h1><p>Most adults feel best with 7 to 9 hours. Log the night by the date you woke up.</p></div></div>
 <div class="stats" style="margin-bottom:16px"><div class="stat"><small>Last night</small><b>${last?hrs(last.bed,last.wake).toFixed(1)+' h':'—'}</b></div><div class="stat"><small>7-day average</small><b>${avg?avg.toFixed(1)+' h':'—'}</b></div><div class="stat"><small>Average quality</small><b>${aq?QUAL[Math.round(aq)-1]:'—'}</b></div></div>

 <div class="card"><h3>Last 7 nights</h3>${days.map(d=>{const x=S.sleep[d],h=x?hrs(x.bed,x.wake):0;return `<div style="display:grid;grid-template-columns:3.2em minmax(0,1fr) 3.4em;gap:10px;align-items:center;margin:10px 0"><span class="muted">${parse(d).toLocaleDateString('en-PH',{weekday:'short'})}</span><div class="bar${h>=7&&h<=9?' g':''}" style="height:16px"><i style="width:${Math.min(100,h/10*100)}%"></i></div><span class="num">${x?h.toFixed(1)+' h':'—'}</span></div>`}).join('')}<p class="muted">Green means 7 to 9 hours.</p></div>
 <div class="card"><h3>History</h3>${list.length?`<ul class="list">${list.map(d=>{const x=S.sleep[d];return `<li><div><b>${nice(d)}</b><div class="muted">${x.bed} to ${x.wake} · ${QUAL[x.q-1]}</div></div><div style="display:flex;align-items:center;gap:4px"><span class="num">${hrs(x.bed,x.wake).toFixed(1)} h</span><button class="sm del" data-a="sldel" data-id="${d}" aria-label="Delete">×</button></div></li>`}).join('')}</ul>`:'<p class="empty">No nights logged yet.</p>'}</div></div>`};

V.cycle=()=>{
 const c=cycleInfo(),t=TODAY(),list=[...S.periods].sort((a,b)=>b.start.localeCompare(a.start));
 let ring='',msg='';
 if(c){const p=Math.min(100,Math.max(0,c.day/c.avg*100)),dn=daysTo(c.next);ring=`<div class="ring" style="background:conic-gradient(var(--rose) 0 ${p}%,var(--paper2) ${p}% 100%)"><div><span class="big">${c.day}</span><span class="muted">day of cycle</span></div></div>`;msg=dn>0?`Next period expected in <b>${dn} ${dn===1?'day':'days'}</b> (${nice(c.next)})`:dn===0?'Next period expected <b>today</b>':`Period is <b>${-dn} ${dn===-1?'day':'days'} later</b> than expected`}

 <div class="grid"><div class="card stack" style="text-align:center">${c?ring+`<p>${msg}</p><p class="muted">Average cycle ${c.avg} days · average period ${c.plen} days</p>${!c.last.end&&c.day<=10?`<button data-a="cyend" data-id="${c.last.id}">My period ended today</button>`:''}`:'<p class="empty">Log your last period to see predictions.</p>'}<p class="muted" style="font-size:13px">Estimates only. Not reliable for preventing pregnancy.</p></div>

 <div class="card"><h3>History</h3>${list.length?`<ul class="list">${list.map(p=>`<li><div><b>${nice(p.start)}</b><div class="muted">${p.end?'to '+nice(p.end)+' · '+(daysTo(p.end)-daysTo(p.start)+1)+' days':'Ongoing or end not logged'}</div></div><button class="sm del" data-a="cydel" data-id="${p.id}" aria-label="Delete">×</button></li>`).join('')}</ul>`:'<p class="empty">No periods logged yet.</p>'}</div></div>`};

function drawMood(){
 const s=$('#ms');if(!s)return;
 const W=s.clientWidth,H=s.clientHeight,L=28,R=10,T=12,B=26,days=[...Array(14)].map((_,i)=>addDays(TODAY(),i-13));
 const x=i=>L+i*(W-L-R)/13,y=v=>T+(10-v)*(H-T-B)/9;
 const line=(k,col)=>{let p='',dots='';days.forEach((d,i)=>{const c=S.checkins[d];if(c){p+=(p?'L':'M')+x(i).toFixed(1)+' '+y(c[k]).toFixed(1);dots+=`<circle cx="${x(i)}" cy="${y(c[k])}" r="4" fill="${col}"/>`}});return `<path d="${p}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round"/>${dots}`};
 let g=[1,5,10].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join('');
 const step=W<520?3:2;
 g+=days.map((d,i)=>i%step===(13%step)?`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${parse(d).getDate()}</text>`:'').join('');
 const any=days.some(d=>S.checkins[d]);
 s.innerHTML=g+(any?line('mood','var(--sage)')+line('anx','var(--rose)'):`<text x="${W/2}" y="${H/2}" text-anchor="middle">Your check-ins will show up here</text>`);
}

const SB_URL='https://yccwlaebuzsylovbupzx.supabase.co',SB_KEY='sb_publishable_h5Dce11JqBYHPwhrwMZLiQ_7w2WLzMv',FN=SB_URL+'/functions/v1/account';

const TE=new TextEncoder(),TD=new TextDecoder(),C=crypto.subtle;
const b64=u=>{let s='';new Uint8Array(u).forEach(b=>s+=String.fromCharCode(b));return btoa(s)};
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const hex=async t=>[...new Uint8Array(await C.digest('SHA-256',TE.encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('');
async function kdf(secret,salt,iter){const base=await C.importKey('raw',TE.encode(secret),'PBKDF2',false,['deriveKey']);return C.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(key,bytes){const iv=rnd(12);return{iv:b64(iv),ct:b64(await C.encrypt({name:'AES-GCM',iv},key,bytes))}}
async function open_(key,ct,iv){return new Uint8Array(await C.decrypt({name:'AES-GCM',iv:ub64(iv)},key,ub64(ct)))}
const useKey=raw=>C.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']);
const B32='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
function newRecKey(){const b=rnd(20);let bits='',s='';b.forEach(x=>bits+=x.toString(2).padStart(8,'0'));for(let i=0;i<bits.length;i+=5)s+=B32[parseInt(bits.slice(i,i+5),2)];return s.match(/.{4}/g).join('-')}
const normRec=k=>String(k||'').toUpperCase().replace(/[^A-Z2-7]/g,'');
const recProof=k=>hex('sheila-space-proof|'+normRec(k));
const REC_ITER=100000;
// device key store (non-extractable key kept in IndexedDB, so a remembered device doesn't need the password every time)
function idb(){return new Promise((ok,no)=>{const r=indexedDB.open('sheila-space',1);r.onupgradeneeded=()=>r.result.createObjectStore('keys');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function kv(op,id,val){try{const db=await idb();return await new Promise((ok,no)=>{const t=db.transaction('keys',op==='get'?'readonly':'readwrite'),s=t.objectStore('keys'),r=op==='get'?s.get(id):op==='put'?s.put(val,id):s.delete(id);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}catch(e){return null}}
async function callFn(body,token){const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY,Authorization:'Bearer '+(token||SB_KEY)},body:JSON.stringify(body)});let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.error||'Something went wrong. Try again.');return j}

async function pushNow(){
 if(!ME||!DK||saving||!dirty)return;saving=true;clearTimeout(saveT);status('Saving…');
 try{const c=await seal(DK,TE.encode(JSON.stringify(S)));const now=new Date().toISOString();

async function loadVault(){
 const{data:v,error}=await sb.from('vaults').select('*').eq('user_id',ME.id).maybeSingle();
 let src=null;try{src=JSON.parse(localStorage.getItem(cacheK())||'null')}catch(e){}
 const localDirty=(()=>{try{return localStorage.getItem(dirtyK())==='1'}catch(e){return false}})();
 if(error){if(!src)throw new Error('No internet connection. Try again.');}else if(!v)return null;
 let use=src;if(v&&v.data&&!(localDirty&&src))use={data:v.data,iv:v.data_iv};
 if(use&&use.data){const st=JSON.parse(TD.decode(await open_(DK,use.data,use.iv)));S=Object.assign(DEF(),st)}else S=DEF();
 if(localDirty&&src){dirty=true;setTimeout(pushNow,500)}
 return v||{}}
async function createVault(pw,name,imported){
 const raw=rnd(32),salt=rnd(16),rsalt=rnd(16),rec=newRecKey();
 const a=await seal(await kdf(pw,salt,310000),raw),b=await seal(await kdf(normRec(rec),rsalt,REC_ITER),raw);
 DK=await useKey(raw);S=Object.assign(DEF(),imported||{});S.name=name||S.name;
 const c=await seal(DK,TE.encode(JSON.stringify(S)));
 const{error}=await sb.from('vaults').upsert({user_id:ME.id,salt:b64(salt),iter:310000,wk_pw:a.ct,iv_pw:a.iv,rec_salt:b64(rsalt),wk_rec:b.ct,iv_rec:b.iv,data:c.ct,data_iv:c.iv,updated_at:new Date().toISOString()});
 if(error)throw error;return rec}
